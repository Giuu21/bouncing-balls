<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bouncing Balls</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111827;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(#0f172a, #111827);
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");

    let balls = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createBall(color) {
      const radius = randomBetween(18, 32);

      return {
        x: randomBetween(radius, canvas.width - radius),
        y: randomBetween(radius, canvas.height - radius),
        vx: randomBetween(-4, 4),
        vy: randomBetween(-4, 4),
        radius,
        color
      };
    }

    function addBall(color) {
      balls.push(createBall(color));
    }

    function clearBalls() {
      balls = [];
    }

    function update() {
      for (const ball of balls) {
        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.x - ball.radius <= 0 || ball.x + ball.radius >= canvas.width) {
          ball.vx *= -1;
          ball.x = Math.max(ball.radius, Math.min(canvas.width - ball.radius, ball.x));
        }

        if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
          ball.vy *= -1;
          ball.y = Math.max(ball.radius, Math.min(canvas.height - ball.radius, ball.y));
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const ball of balls) {
        ctx.beginPath();
        ctx.fillStyle = ball.color;
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function animate() {
      update();
      draw();
      requestAnimationFrame(animate);
    }

    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();

      if (key === "g") {
        addBall("#22c55e");
      } else if (key === "p") {
        addBall("#f472b6");
      } else if (key === "c") {
        addBall("#22d3ee");
      } else if (event.code === "Space") {
        clearBalls();
      }
    });

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    animate();
  </script>
</body>
</html>
